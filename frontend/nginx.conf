server {
    listen 80;
    server_name _;

    gzip_static on;

    # Redirect bare root to the app
    location = / {
        return 301 /chord-shift/;
    }

    # Serve the SPA - files live at /usr/share/nginx/html/chord-shift/
    location /chord-shift/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /chord-shift/index.html;
    }
}
