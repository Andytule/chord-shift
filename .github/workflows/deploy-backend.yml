name: Deploy Backend → Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'types/**'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Trigger Render deploy
        # Render watches your GitHub repo directly when connected via the dashboard.
        # This step is only needed if you prefer a deploy-hook approach instead.
        # To use it: add your Render Deploy Hook URL as RENDER_DEPLOY_HOOK in
        # Settings → Secrets and variables → Actions.
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deploy via deploy hook..."
            curl -fsSL "$RENDER_DEPLOY_HOOK" -o /dev/null
            echo "Deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK not set — Render will deploy automatically via its GitHub integration."
          fi
